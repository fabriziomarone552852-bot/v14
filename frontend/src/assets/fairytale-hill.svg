<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" fill="none">
  <defs>
    <!-- Gradienti Collina -->
    <linearGradient id="hillBackGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#6ee7b7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hillMidGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="40%" stop-color="#34d399"/>
      <stop offset="85%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#bbf7d0" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="hillFrontGrad" x1="100%" y1="10%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="35%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#22c55e"/>
      <stop offset="95%" stop-color="#4ade80" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#86efac" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="100%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </linearGradient>
    <!-- Filtro bagliore fatato -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Bagliore magico sullo sfondo a destra -->
  <circle cx="750" cy="30" r="140" fill="url(#sunGlow)"/>

  <!-- 1. COLLINA SFONDO (Distanza) -->
  <path d="M400,240 Q580,120 740,60 Q780,45 800,40 L800,240 Z" fill="url(#hillBackGrad)"/>

  <!-- 2. COLLINA MEDIA -->
  <path d="M220,240 Q420,160 620,90 Q720,55 800,50 L800,240 Z" fill="url(#hillMidGrad)"/>

  <!-- Piccoli alberelli fiabeschi in lontananza sulla cresta -->
  <g opacity="0.65">
    <ellipse cx="730" cy="55" rx="14" ry="20" fill="#047857"/>
    <ellipse cx="722" cy="58" rx="10" ry="15" fill="#065f46"/>
    <ellipse cx="740" cy="60" rx="11" ry="16" fill="#059669"/>
    <ellipse cx="680" cy="75" rx="12" ry="18" fill="#047857"/>
    <ellipse cx="672" cy="78" rx="9" ry="13" fill="#065f46"/>
  </g>

  <!-- 3. COLLINA PRIMO PIANO (Principale, scende maestosa da destra a sinistra) -->
  <path d="M80,240 Q260,200 460,135 Q650,75 800,65 L800,240 Z" fill="url(#hillFrontGrad)"/>

  <!-- Dettagli cresta e ciuffi d'erba luminosi -->
  <path d="M120,240 C300,195 480,130 670,72 C730,55 780,60 800,65" stroke="#86efac" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- FIORI E VEGETAZIONE FATATA -->
  
  <!-- Gruppo Fiori Rosa / Magenta -->
  <g fill="#f43f5e">
    <circle cx="760" cy="110" r="4.5"/>
    <circle cx="752" cy="104" r="4"/>
    <circle cx="766" cy="116" r="3.5"/>
    <circle cx="680" cy="130" r="5"/>
    <circle cx="692" cy="125" r="4"/>
    <circle cx="620" cy="155" r="5.5"/>
    <circle cx="608" cy="162" r="4"/>
    <circle cx="530" cy="175" r="5"/>
    <circle cx="450" cy="195" r="4.5"/>
    <circle cx="360" cy="215" r="4"/>
    <circle cx="280" cy="228" r="3.5"/>
  </g>
  <!-- Centri gialli fiori rosa -->
  <g fill="#fef08a">
    <circle cx="760" cy="110" r="1.5"/>
    <circle cx="680" cy="130" r="1.8"/>
    <circle cx="620" cy="155" r="2"/>
    <circle cx="530" cy="175" r="1.8"/>
    <circle cx="450" cy="195" r="1.5"/>
  </g>

  <!-- Gruppo Fiori Arancio / Papaveri -->
  <g fill="#fb923c">
    <circle cx="730" cy="135" r="5"/>
    <circle cx="738" cy="142" r="4"/>
    <circle cx="650" cy="145" r="5.5"/>
    <circle cx="570" cy="170" r="5"/>
    <circle cx="490" cy="190" r="4.5"/>
    <circle cx="410" cy="210" r="4"/>
    <circle cx="320" cy="225" r="3.5"/>
    <circle cx="230" cy="233" r="3"/>
  </g>
  <g fill="#7c2d12">
    <circle cx="730" cy="135" r="1.5"/>
    <circle cx="650" cy="145" r="1.8"/>
    <circle cx="570" cy="170" r="1.5"/>
  </g>

  <!-- Gruppo Fiori Gialli / Margherita Dorata -->
  <g fill="#facc15">
    <circle cx="770" cy="85" r="4"/>
    <circle cx="710" cy="115" r="4.5"/>
    <circle cx="665" cy="165" r="5"/>
    <circle cx="590" cy="180" r="4.5"/>
    <circle cx="510" cy="200" r="4"/>
    <circle cx="430" cy="218" r="4"/>
    <circle cx="350" cy="230" r="3.5"/>
    <circle cx="180" cy="237" r="3"/>
  </g>
  <g fill="#ca8a04">
    <circle cx="710" cy="115" r="1.5"/>
    <circle cx="665" cy="165" r="1.5"/>
    <circle cx="590" cy="180" r="1.5"/>
  </g>

  <!-- Gruppo Fiori Bianchi / Piccole Margherite di campo -->
  <g fill="#ffffff" filter="url(#softGlow)">
    <circle cx="745" cy="95" r="3.5"/>
    <circle cx="700" cy="140" r="3.5"/>
    <circle cx="640" cy="170" r="4"/>
    <circle cx="550" cy="185" r="3.5"/>
    <circle cx="470" cy="205" r="3.5"/>
    <circle cx="380" cy="222" r="3"/>
    <circle cx="290" cy="232" r="3"/>
    <circle cx="200" cy="238" r="2.5"/>
  </g>
  <g fill="#eab308">
    <circle cx="745" cy="95" r="1.2"/>
    <circle cx="700" cy="140" r="1.2"/>
    <circle cx="640" cy="170" r="1.4"/>
    <circle cx="550" cy="185" r="1.2"/>
    <circle cx="470" cy="205" r="1.2"/>
  </g>

  <!-- Gruppo Fiori Viola / Lavanda e Campanule -->
  <g fill="#a855f7">
    <circle cx="780" cy="125" r="4"/>
    <circle cx="670" cy="120" r="4.5"/>
    <circle cx="580" cy="150" r="4"/>
    <circle cx="520" cy="165" r="3.5"/>
    <circle cx="440" cy="188" r="3.5"/>
    <circle cx="330" cy="218" r="3"/>
  </g>

  <!-- Gruppi di Arbusti e Fogliame in primo piano a destra -->
  <g fill="#047857" opacity="0.85">
    <circle cx="790" cy="170" r="22"/>
    <circle cx="765" cy="185" r="18"/>
    <circle cx="785" cy="205" r="20"/>
    <circle cx="740" cy="215" r="16"/>
  </g>
  <g fill="#10b981" opacity="0.9">
    <circle cx="785" cy="165" r="16"/>
    <circle cx="760" cy="180" r="13"/>
    <circle cx="780" cy="200" r="15"/>
    <circle cx="735" cy="210" r="12"/>
  </g>

  <!-- Ciuffi d'Erba Stilizzati lungo il pendio -->
  <g stroke="#15803d" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M720,150 L718,140 M720,150 L724,142"/>
    <path d="M635,180 L632,168 M635,180 L639,170"/>
    <path d="M545,195 L542,185 M545,195 L549,187"/>
    <path d="M465,212 L462,202 M465,212 L469,204"/>
    <path d="M375,225 L372,216 M375,225 L378,218"/>
    <path d="M260,234 L258,226 M260,234 L263,228"/>
  </g>

  <!-- PARTICELLE E SCINTILLE MAGICHE FATATE (Sparkles) -->
  <g fill="#ffffff" filter="url(#softGlow)">
    <!-- Scintille a 4 punte -->
    <path d="M710,75 Q710,82 717,82 Q710,82 710,89 Q710,82 703,82 Q710,82 710,75 Z" opacity="0.9"/>
    <path d="M630,110 Q630,115 635,115 Q630,115 630,120 Q630,115 625,115 Q630,115 630,110 Z" opacity="0.85"/>
    <path d="M550,135 Q550,140 555,140 Q550,140 550,145 Q550,140 545,140 Q550,140 550,135 Z" opacity="0.8"/>
    <path d="M480,160 Q480,164 484,164 Q480,164 480,168 Q480,164 476,164 Q480,164 480,160 Z" opacity="0.75"/>
    <path d="M390,185 Q390,189 394,189 Q390,189 390,193 Q390,189 386,189 Q390,189 390,185 Z" opacity="0.7"/>
    
    <!-- Punti di luce magica fluttuanti -->
    <circle cx="750" cy="65" r="2" opacity="0.9" fill="#fef08a"/>
    <circle cx="670" cy="95" r="1.8" opacity="0.85" fill="#fbcfe8"/>
    <circle cx="590" cy="120" r="2.2" opacity="0.8" fill="#fef08a"/>
    <circle cx="515" cy="145" r="1.6" opacity="0.75" fill="#bae6fd"/>
    <circle cx="435" cy="170" r="2" opacity="0.7" fill="#fef08a"/>
    <circle cx="340" cy="195" r="1.5" opacity="0.65" fill="#fbcfe8"/>
  </g>

  <!-- Farfalla Fatata in volo -->
  <g transform="translate(640, 60) rotate(-15) scale(0.8)">
    <path d="M0,0 Q-8,-12 0,-16 Q4,-8 0,0" fill="#f472b6" opacity="0.85"/>
    <path d="M0,0 Q8,-12 0,-16 Q-4,-8 0,0" fill="#ec4899" opacity="0.85"/>
    <path d="M0,0 Q-6,8 0,10 Q2,4 0,0" fill="#f472b6" opacity="0.75"/>
    <path d="M0,0 Q6,8 0,10 Q-2,4 0,0" fill="#ec4899" opacity="0.75"/>
    <circle cx="0" cy="-4" r="1.5" fill="#831843"/>
  </g>
</svg>
