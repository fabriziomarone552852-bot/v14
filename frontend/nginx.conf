server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # File statici del build React (assets JS/CSS con cache e 404 corretto)
    location /assets/ {
        try_files $uri =404;
    }

    # Reverse Proxy per inoltrare tutte le chiamate API al container backend FastAPI
    location ~ ^/(api|auth|users|tasks|events|categories|shopping|analytics|admin|daily-entries|countdowns|habits|sync|catalogs|monthly-entries|yearly-entries|bingo|notifications|system|refresh|docs|openapi\.json|redoc)(/|$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Supporto per il routing Single Page Application (SPA React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /favicon.svg { try_files $uri =404; }
    location = /robots.txt  { log_not_found off; access_log off; }
}
